<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E7B4" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA820A" />
      <stop offset="100%" stop-color="#E5C158" />
    </linearGradient>

    <!-- Radial Soft Gold Glow -->
    <radialGradient id="goldRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Background Glow -->
  <circle cx="100" cy="100" r="94" fill="url(#goldRadial)" />

  <!-- Outer Fine Ornamental Ring -->
  <circle cx="100" cy="100" r="90" stroke="url(#goldLinear)" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.75" />

  <!-- Main Outer Ring -->
  <circle cx="100" cy="100" r="82" stroke="url(#goldLinear)" stroke-width="2.5" />

  <!-- Inner Fine Ring -->
  <circle cx="100" cy="100" r="76" stroke="url(#goldLinear)" stroke-width="1" opacity="0.6" />

  <!-- Temple Mandapa Top Arch Motifs (Top & Bottom Center) -->
  <path d="M100 12 L104 22 L96 22 Z" fill="url(#goldLinear)" />
  <path d="M100 188 L104 178 L96 178 Z" fill="url(#goldLinear)" />
  <path d="M12 100 L22 104 L22 96 Z" fill="url(#goldLinear)" />
  <path d="M188 100 L178 104 L178 96 Z" fill="url(#goldLinear)" />

  <!-- Bihari Lotus Petal Accents (Top Arch Ornament) -->
  <path d="M100 28 C92 38 108 38 100 28 Z" fill="url(#goldLinear)" opacity="0.85" />
  
  <!-- Stylized Luxury "V" Monogram with Bihari Heritage Flairs -->
  <!-- Left Stem of V -->
  <path d="M52 52 C58 52 64 56 68 64 L96 138 C98 143 102 143 104 138 L132 64 C136 56 142 52 148 52 C150 52 153 53 153 55 C153 58 149 61 144 64 L109 148 C104 160 96 160 91 148 L56 64 C51 61 47 58 47 55 C47 53 50 52 52 52 Z" fill="url(#goldLinear)" />
  
  <!-- Elegant Inner V Swirl & Temple Apex Arch -->
  <path d="M72 60 C84 60 94 72 100 86 C106 72 116 60 128 60 C122 68 114 82 100 114 C86 82 78 68 72 60 Z" fill="url(#goldLinear)" opacity="0.4" />

  <!-- Central Lotus Flower Motif inside V -->
  <path d="M100 70 C104 80 104 92 100 102 C96 92 96 80 100 70 Z" fill="url(#goldLinear)" />
  <path d="M100 82 C108 80 116 86 118 94 C110 94 104 90 100 82 Z" fill="url(#goldLinear)" opacity="0.9" />
  <path d="M100 82 C92 80 84 86 82 94 C90 94 96 90 100 82 Z" fill="url(#goldLinear)" opacity="0.9" />

  <!-- Four Heritage Accent Dots -->
  <circle cx="65" cy="135" r="2.5" fill="url(#goldLinear)" />
  <circle cx="135" cy="135" r="2.5" fill="url(#goldLinear)" />
  <circle cx="100" cy="168" r="3" fill="url(#goldLinear)" />
  <circle cx="100" cy="38" r="2" fill="url(#goldLinear)" />
</svg>