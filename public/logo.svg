<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Luxury Gold Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF0CA" />
      <stop offset="30%" stop-color="#F3E5AB" />
      <stop offset="65%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#997D20" />
    </linearGradient>
    
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8DC" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8B6914" />
    </linearGradient>

    <!-- Radial Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Transparent background -->

  <!-- Outer Fine Filigree Circular Ring -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" />
  <circle cx="250" cy="250" r="226" fill="none" stroke="url(#goldGradient)" stroke-width="1" stroke-dasharray="4 6" opacity="0.8" />
  <circle cx="250" cy="250" r="216" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.9" />

  <!-- Madhubani Sunburst Radial Accents (12 Rays around perimeter) -->
  <g stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.75">
    <line x1="250" y1="18" x2="250" y2="30" />
    <line x1="250" y1="470" x2="250" y2="482" />
    <line x1="18" y1="250" x2="30" y2="250" />
    <line x1="470" y1="250" x2="482" y2="250" />
    <line x1="86" y1="86" x2="95" y2="95" />
    <line x1="405" y1="405" x2="414" y2="414" />
    <line x1="405" y1="86" x2="396" y2="95" />
    <line x1="86" y1="405" x2="95" y2="396" />
  </g>

  <!-- Temple Spire Crest & Arch Motif (Top Crown) -->
  <path d="M 250,38 L 265,68 L 250,60 L 235,68 Z" fill="url(#goldGradient)" />
  <path d="M 250,56 Q 285,78 315,108 M 250,56 Q 215,78 185,108" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Lotus Petal Accents on Top Sides -->
  <path d="M 315,108 Q 330,88 348,98 Q 338,118 315,108 Z" fill="url(#goldGradient)" opacity="0.9" />
  <path d="M 185,108 Q 170,88 152,98 Q 162,118 185,108 Z" fill="url(#goldGradient)" opacity="0.9" />

  <!-- Inner Architectural Ring Frame -->
  <circle cx="250" cy="250" r="190" fill="none" stroke="url(#goldGradient)" stroke-width="3" />

  <!-- Inner Fine Bezel -->
  <circle cx="250" cy="250" r="182" fill="none" stroke="url(#goldGradient)" stroke-width="1" stroke-dasharray="2 4" opacity="0.6" />

  <!-- Side Traditional Bihari Floral Curves -->
  <g fill="url(#goldGradient)">
    <!-- Left Floral Motif -->
    <path d="M 85,250 C 70,220 95,190 120,210 C 105,225 110,245 125,250 C 110,255 105,275 120,290 C 95,310 70,280 85,250 Z" opacity="0.8" />
    <!-- Right Floral Motif -->
    <path d="M 415,250 C 430,220 405,190 380,210 C 395,225 390,245 375,250 C 390,255 395,275 380,290 C 405,310 430,280 415,250 Z" opacity="0.8" />
  </g>

  <!-- CENTRAL MONOGRAM "V" (Scattered Royal Serif with Temple Geometry & Tilkut Curves) -->
  <g filter="url(#goldGlow)">
    <!-- Main Left Stem of 'V' (Elegant Serif Sweep) -->
    <path d="M 142,145 
             C 142,145 178,142 195,145 
             C 192,158 185,178 180,192 
             L 230,332 
             C 236,348 244,362 250,375 
             C 246,360 234,342 224,320 
             L 165,190 
             C 152,162 142,145 142,145 Z" 
          fill="url(#goldShine)" />

    <!-- Main Right Stem of 'V' (Thicker Sculpted Serif Sweep) -->
    <path d="M 358,145 
             C 358,145 322,142 305,145 
             C 310,158 322,185 330,205 
             L 262,358 
             C 256,370 252,378 250,380 
             C 248,378 244,370 238,358 
             L 242,352 
             L 298,220 
             C 318,175 358,145 358,145 Z" 
          fill="url(#goldGradient)" />

    <!-- Solid Royal Serif 'V' Paths (High Precision Vector Art) -->
    <path d="M 148,150 
             L 192,150 
             L 250,360 
             L 308,150 
             L 352,150 
             L 265,372 
             C 258,388 242,388 235,372 
             Z" 
          fill="url(#goldGradient)" 
          stroke="url(#goldShine)" 
          stroke-width="1.5" />

    <!-- Left Top Serif Flourish -->
    <path d="M 135,145 C 145,138 175,138 198,145 C 190,152 180,154 165,154 C 150,154 142,152 135,145 Z" fill="url(#goldShine)" />

    <!-- Right Top Serif Flourish -->
    <path d="M 302,145 C 320,138 350,138 365,145 C 358,152 350,154 335,154 C 320,154 310,152 302,145 Z" fill="url(#goldShine)" />
  </g>

  <!-- Central Lotus & Tilkut Emblem Crest below 'V' apex -->
  <g fill="url(#goldGradient)">
    <!-- Lotus Center Base Petal -->
    <path d="M 250,392 C 242,408 232,425 215,420 C 230,432 245,438 250,446 C 255,438 270,432 285,420 C 268,425 258,408 250,392 Z" />
    <circle cx="250" cy="415" r="4.5" fill="url(#goldShine)" />
    <circle cx="236" cy="425" r="3" fill="url(#goldShine)" />
    <circle cx="264" cy="425" r="3" fill="url(#goldShine)" />
  </g>

  <!-- Bottom Arch Heritage Seal Text Outline or Dots -->
  <circle cx="250" cy="462" r="3" fill="url(#goldGradient)" />
  <circle cx="230" cy="460" r="2" fill="url(#goldGradient)" />
  <circle cx="270" cy="460" r="2" fill="url(#goldGradient)" />
</svg>